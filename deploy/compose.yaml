# Sample Compose definition for lupira-photo-api.
# Single .NET 10 service: photo/video asset orchestration (presigned S3 uploads/reads, thumbnailing,
# geotagging) over its OWN Postgres database and an S3-compatible object store (Garage).
#
# NOTE: the default hostnames, network names, image, and port below are the author's own and are SAMPLES.
# Every value is ${VAR:-default}-overridable — set the env (issuer URL, DB host/password, S3 endpoints/keys,
# image, port, networks) to your own environment before deploying. The external `*_data` / `*_telemetry`
# networks are the author's; replace them (or drop to a single bridge network) for a generic deployment.
services:
  lupira-photo-api:
    image: danbro96/lupira-photo-api:${IMAGE_TAG:-latest}
    container_name: lupira-photo-api
    environment:
      # Postgres — Marten `photo` schema (asset metadata only; bytes live in the object store).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=lupira_photo;Username=lupira_photo_user;Password=${LUPIRA_PHOTO_DB_PASSWORD:?required}"

      # REST auth — Authentik OIDC (JWT). Same issuer as the other Lupira apps; the OIDC `sub` is the only cross-service join key.
      Auth__Oidc__Authority: ${AUTH_AUTHORITY:-https://auth.lupira.com/application/o/lupira-photo/}
      Auth__Oidc__Audience: ${AUTH_AUDIENCE:-lupira-photo}

      # Object store — in-network endpoint for operations, public endpoint for presigned URLs
      # (SigV4 signs the host; the Region must match the store's configured region).
      ObjectStorage__Endpoint: ${OBJECT_STORAGE_ENDPOINT:-http://garage:3900}
      ObjectStorage__PublicEndpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-https://s3.lupira.com}
      ObjectStorage__AccessKey: ${LUPIRA_PHOTO_S3_KEY:?required}
      ObjectStorage__SecretKey: ${LUPIRA_PHOTO_S3_SECRET:?required}
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:-lupira-photo}
      ObjectStorage__Region: ${OBJECT_STORAGE_REGION:-garage}

      # Service-to-service geotagging (client credentials; scopes carry the audiences).
      ServiceAuth__TokenUrl: ${SERVICE_AUTH_TOKEN_URL:-https://auth.lupira.com/application/o/token/}
      ServiceAuth__ClientId: ${SERVICE_AUTH_CLIENT_ID:-lupira-photo-svc}
      ServiceAuth__ClientSecret: ${LUPIRA_PHOTO_SVC_SECRET:-}
      Geo__BaseUrl: ${GEO_BASE_URL:-http://lupira-geo-api:8080/}
      LocationApi__BaseUrl: ${LOCATION_BASE_URL:-http://lupira-location-api:8080/}

      # OTEL — same Basic Auth header convention as the other .NET apps (http/protobuf; 5-min metric cadence).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-300000}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    ports:
      - "${HOST_PORT:-42280}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - medelynas_data         # Postgres, Garage, geo/location APIs
      - medelynas_telemetry    # OTel collector
networks:
  default:
    driver: bridge
  medelynas_data:
    external: true
    name: medelynas_data
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
